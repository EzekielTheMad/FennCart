<div id="wizard-step" class="bg-slate-800 rounded-lg border border-slate-700 p-8" x-data="{ loading: false }">
    <h2 class="text-xl font-semibold text-slate-100 mb-2">Connect your LLM provider</h2>
    <p class="text-slate-400 text-sm mb-6">
        Your API key is read from the environment variable <code class="bg-slate-700 px-1 rounded text-slate-300">LLM_API_KEY</code>.
        Enter it here to validate the connection &mdash; it will not be stored.
    </p>

    {% if error %}
    <div class="bg-red-950 border border-red-800 rounded p-3 mb-4">
        <p class="text-red-400 text-sm">{{ error }}</p>
    </div>
    {% endif %}

    <div class="mb-6">
        <label class="block text-sm font-semibold text-slate-300 mb-1">API Key</label>
        <input
            type="text"
            value="{{ masked_api_key }}"
            readonly
            class="w-full bg-slate-700 text-slate-400 border border-slate-600 rounded px-3 py-2 text-sm font-mono cursor-not-allowed"
            placeholder="sk-ant-..."
        >
        <p class="text-slate-500 text-xs mt-1">Set via <code>LLM_API_KEY</code> environment variable</p>
    </div>

    <form
        hx-post="/setup/validate-llm"
        hx-target="#wizard-step"
        hx-swap="outerHTML"
        @htmx:before-request="loading = true"
        @htmx:after-request="loading = false"
    >
        <button
            type="submit"
            :disabled="loading"
            class="w-full bg-green-600 hover:bg-green-700 disabled:opacity-60 disabled:cursor-not-allowed text-white font-semibold py-2 px-4 rounded transition-colors"
        >
            <span x-show="!loading">Test connection</span>
            <span x-show="loading" class="flex items-center justify-center gap-2">
                <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Testing...
            </span>
        </button>
    </form>
</div>
