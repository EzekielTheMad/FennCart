<div id="wizard-step" class="bg-slate-800 rounded-lg border border-slate-700 p-8" x-data="{ loading: false, searching: false }">
    <h2 class="text-xl font-semibold text-slate-100 mb-2">Choose your Fry's store</h2>
    <p class="text-slate-400 text-sm mb-6">
        Enter your zip code to find nearby Fry's stores.
    </p>

    {% if message and not stores %}
    <div class="bg-slate-700 border border-slate-600 rounded p-3 mb-4">
        <p class="text-slate-400 text-sm">{{ message }}</p>
    </div>
    {% endif %}

    <!-- Search form -->
    <form
        hx-post="/setup/search-stores"
        hx-target="#wizard-step"
        hx-swap="outerHTML"
        @htmx:before-request="searching = true"
        @htmx:after-request="searching = false"
        class="flex gap-2 mb-6"
    >
        <input
            type="text"
            name="zip_code"
            value="{{ zip_code or '' }}"
            placeholder="85001"
            class="flex-1 bg-slate-700 text-slate-100 border border-slate-600 rounded px-3 py-2 placeholder-slate-500 focus:outline-none focus:border-slate-400"
        >
        <button
            type="submit"
            :disabled="searching"
            class="bg-green-600 hover:bg-green-700 disabled:opacity-60 disabled:cursor-not-allowed text-white font-semibold px-4 py-2 rounded transition-colors whitespace-nowrap"
        >
            <span x-show="!searching">Find stores</span>
            <span x-show="searching" class="flex items-center gap-2">
                <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Searching...
            </span>
        </button>
    </form>

    <!-- Store results -->
    {% if stores %}
    <div>
        <h3 class="text-sm font-semibold text-slate-300 mb-3">Nearby stores</h3>
        <div class="space-y-2">
            {% for store in stores %}
            <form
                hx-post="/setup/select-store"
                hx-target="#wizard-step"
                hx-swap="outerHTML"
            >
                <input type="hidden" name="store_id" value="{{ store.locationId }}">
                <input type="hidden" name="store_name" value="{{ store.name }}">
                <input type="hidden" name="store_zip" value="{{ zip_code or '' }}">
                <button
                    type="submit"
                    class="w-full text-left bg-slate-700 hover:bg-slate-600 border border-slate-600 hover:border-slate-500 rounded px-4 py-3 transition-colors"
                >
                    <p class="text-slate-100 text-sm font-semibold">{{ store.name }}</p>
                    <p class="text-slate-400 text-xs mt-0.5">{{ store.address }}</p>
                </button>
            </form>
            {% endfor %}
        </div>
    </div>
    {% endif %}

    {% if selected_store %}
    <div class="bg-green-950 border border-green-800 rounded p-3 mt-4">
        <p class="text-green-400 text-sm font-semibold">{{ selected_store }} selected</p>
    </div>
    {% endif %}
</div>
