<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FennCart{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"
            integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2uoICGOr+ML4v3a3bEXvn+w/GJWI9SQKDT"
            crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"
            integrity="sha384-9G4KJJlXVJr5kd0x3x0c0V5TrEfBu/b7qnM0N6aPdLFMJKqKDxSXQ/VhL/M0LQT"
            crossorigin="anonymous"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex" style="font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;">

    <!-- Left sidebar -->
    <aside class="bg-slate-900 border-r border-slate-700 flex flex-col w-16 lg:w-60 min-h-screen shrink-0">

        <!-- App name -->
        <div class="p-4 flex items-center gap-3 min-h-[64px]">
            <!-- Shopping cart icon as logo mark -->
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-green-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
            </svg>
            <span class="text-lg font-semibold text-slate-100 hidden lg:block">FennCart</span>
        </div>

        <!-- Nav items -->
        <nav class="flex-1 px-2 py-2 space-y-1">

            <!-- Shopping -->
            <a href="/shopping"
               class="flex items-center gap-3 px-2 min-h-[44px] rounded-md transition-colors
                      {% if active_page == 'shopping' %}bg-slate-800 border-l-2 border-green-500 text-slate-100{% else %}text-slate-400 hover:bg-slate-800 hover:text-slate-100{% endif %}">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
                </svg>
                <span class="hidden lg:block text-sm font-semibold">Shopping</span>
            </a>

            <!-- Preferences -->
            <a href="/preferences"
               class="flex items-center gap-3 px-2 min-h-[44px] rounded-md transition-colors
                      {% if active_page == 'preferences' %}bg-slate-800 border-l-2 border-green-500 text-slate-100{% else %}text-slate-400 hover:bg-slate-800 hover:text-slate-100{% endif %}">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
                </svg>
                <span class="hidden lg:block text-sm font-semibold">Preferences</span>
            </a>

            <!-- History -->
            <a href="/history"
               class="flex items-center gap-3 px-2 min-h-[44px] rounded-md transition-colors
                      {% if active_page == 'history' %}bg-slate-800 border-l-2 border-green-500 text-slate-100{% else %}text-slate-400 hover:bg-slate-800 hover:text-slate-100{% endif %}">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                </svg>
                <span class="hidden lg:block text-sm font-semibold">History</span>
            </a>

            <!-- Settings -->
            <a href="/settings"
               class="flex items-center gap-3 px-2 min-h-[44px] rounded-md transition-colors
                      {% if active_page == 'settings' %}bg-slate-800 border-l-2 border-green-500 text-slate-100{% else %}text-slate-400 hover:bg-slate-800 hover:text-slate-100{% endif %}">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>
                <span class="hidden lg:block text-sm font-semibold">Settings</span>
            </a>

        </nav>
    </aside>

    <!-- Main content area -->
    <main class="flex-1 min-h-screen">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
