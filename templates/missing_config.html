<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FennCart -- Setup Required</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center py-16" style="font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;">
    <div class="max-w-lg w-full px-6">
        <h1 class="text-3xl font-semibold text-slate-100 mb-4">Container needs configuration</h1>
        <p class="text-base text-slate-400 mb-8">
            FennCart can't start because required environment variables are missing.
            Set them in your .env file or Docker environment and restart the container.
        </p>
        <div class="bg-slate-800 rounded-md p-4 mb-8">
            <code class="text-slate-100 text-sm">
                {% for var in missing_vars %}
                <span class="block">{{ var }}</span>
                {% endfor %}
            </code>
        </div>
        <a href="#" class="text-green-400 hover:text-green-300 text-sm underline">
            View setup instructions
        </a>
    </div>
</body>
</html>
