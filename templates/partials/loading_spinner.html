{# loading_spinner.html — Reusable spinner for LLM matching in-progress state (D-08) #}
<div class="flex flex-col items-center justify-center min-h-[300px] gap-4">
    <svg class="animate-spin w-8 h-8 text-green-500"
         xmlns="http://www.w3.org/2000/svg"
         fill="none"
         viewBox="0 0 24 24"
         aria-hidden="true">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    <p class="text-base font-semibold text-slate-100">Matching your items...</p>
    <p class="text-sm text-slate-400">This takes a few seconds while FennCart searches Kroger for each item.</p>
</div>
