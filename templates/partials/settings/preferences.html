<div class="bg-slate-800 rounded-lg border border-slate-700 p-8">
    <h2 class="text-xl font-semibold text-slate-100 mb-6">Preferences</h2>

    {% if success %}
    <div class="bg-green-950 border border-green-800 rounded p-3 text-green-400 text-sm mb-4">{{ success }}</div>
    {% endif %}

    <form hx-post="/settings/save-preferences"
          hx-target="#settings-content"
          hx-swap="innerHTML">

        <!-- Review mode toggle -->
        <div class="mb-6">
            <div class="flex items-center justify-between py-4 border-b border-slate-700 mb-4">
                <div>
                    <p class="text-sm font-semibold text-slate-100">Default review mode</p>
                    <p class="text-xs text-slate-500 mt-0.5">Show all matched items for review, or only items FennCart is unsure about.</p>
                </div>
            </div>

            <div class="space-y-3">
                <!-- Exceptions only -->
                <label class="flex items-start gap-3 bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded px-4 py-3 cursor-pointer transition-colors">
                    <input type="radio"
                           name="review_mode"
                           value="exceptions"
                           {% if cfg.review_mode == 'exceptions' %}checked{% endif %}
                           class="mt-0.5 accent-green-500 shrink-0">
                    <div>
                        <p class="text-sm font-semibold text-slate-100">Exceptions only (recommended)</p>
                        <p class="text-xs text-slate-400 mt-0.5">High-confidence matches are added automatically. Only uncertain items are shown for review.</p>
                    </div>
                </label>

                <!-- Full review -->
                <label class="flex items-start gap-3 bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded px-4 py-3 cursor-pointer transition-colors">
                    <input type="radio"
                           name="review_mode"
                           value="full"
                           {% if cfg.review_mode == 'full' %}checked{% endif %}
                           class="mt-0.5 accent-green-500 shrink-0">
                    <div>
                        <p class="text-sm font-semibold text-slate-100">Full review</p>
                        <p class="text-xs text-slate-400 mt-0.5">Every matched item is shown for your approval before anything is added to the cart.</p>
                    </div>
                </label>
            </div>
        </div>

        <!-- Save button -->
        <button type="submit"
                class="bg-slate-700 hover:bg-slate-600 text-slate-100 font-semibold py-2 px-4 rounded transition-colors">
            Save preferences
        </button>

    </form>
</div>
