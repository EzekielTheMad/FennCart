{% if error_message %}
<div class="bg-red-950 border border-red-800 rounded p-3 mb-4">
    <p class="text-red-400 text-sm">{{ error_message }}</p>
</div>
{% endif %}

{% if stores %}
<div>
    <h3 class="text-sm font-semibold text-slate-300 mb-3">Nearby stores</h3>
    <div class="space-y-2">
        {% for store in stores %}
        <form
            hx-post="/setup/select-store"
            hx-target="#wizard-step"
            hx-swap="outerHTML"
        >
            <input type="hidden" name="store_id" value="{{ store.locationId }}">
            <input type="hidden" name="store_name" value="{{ store.name }}">
            <input type="hidden" name="store_zip" value="{{ zip_code or '' }}">
            <button
                type="submit"
                class="w-full text-left bg-slate-700 hover:bg-slate-600 border border-slate-600 hover:border-slate-500 rounded px-4 py-3 transition-colors"
            >
                <p class="text-slate-100 text-sm font-semibold">{{ store.name }}</p>
                <p class="text-slate-400 text-xs mt-0.5">{{ store.address }}</p>
            </button>
        </form>
        {% endfor %}
    </div>
</div>
{% endif %}

{% if selected_store %}
<div class="bg-green-950 border border-green-800 rounded p-3 mt-4">
    <p class="text-green-400 text-sm font-semibold">{{ selected_store }} selected</p>
</div>
{% endif %}
