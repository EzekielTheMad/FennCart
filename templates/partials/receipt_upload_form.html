{#
  receipt_upload_form.html — Drag-and-drop PDF upload drop zone.
  No context vars required.
#}
<div
  x-data="{ dragging: false }"
  @dragover.prevent="dragging = true"
  @dragleave.prevent="dragging = false"
  @drop.prevent="dragging = false; $refs.fileInput.files = $event.dataTransfer.files; $refs.uploadForm.requestSubmit()"
>

  <form
    x-ref="uploadForm"
    hx-post="/preferences/upload"
    hx-encoding="multipart/form-data"
    hx-target="#receipt-panel"
    hx-swap="innerHTML"
    hx-indicator="#upload-spinner"
  >

    <!-- Drop zone -->
    <div
      :class="dragging ? 'border-green-500 bg-slate-700' : 'border-slate-700 bg-slate-800 hover:border-green-500'"
      class="border-2 border-dashed rounded-lg p-12 text-center transition-colors cursor-pointer"
      @click="$refs.fileInput.click()"
    >
      <!-- Heroicons document (24px) -->
      <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-slate-400 mx-auto" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
      </svg>

      <p class="text-base font-semibold text-slate-100 mt-4">Drop your Fry's receipt PDF here</p>
      <p class="text-sm text-slate-400 mt-1">or click to choose a file</p>
      <p class="text-xs text-slate-500 mt-2">Accepts: PDF files only</p>

      <!-- Hidden file input -->
      <input
        type="file"
        name="receipt_pdf"
        accept=".pdf"
        x-ref="fileInput"
        class="hidden"
        @change="$refs.uploadForm.requestSubmit()"
        aria-label="Choose a receipt PDF to upload"
      >
    </div>

  </form>

  <!-- Upload/parse spinner (htmx-indicator) -->
  <div id="upload-spinner" class="htmx-indicator flex flex-col items-center py-8">
    <svg class="animate-spin w-8 h-8 text-green-500"
         xmlns="http://www.w3.org/2000/svg"
         fill="none"
         viewBox="0 0 24 24"
         aria-hidden="true">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    <p class="text-sm text-slate-400 mt-4">Parsing your receipt...</p>
    <p class="text-xs text-slate-500 mt-1">This takes a few seconds while FennCart reads your PDF.</p>
  </div>

</div>
