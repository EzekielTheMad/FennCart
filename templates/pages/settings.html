{% extends "base.html" %}
{% set active_page = "settings" %}

{% block title %}Settings — FennCart{% endblock %}

{% block content %}
<div class="flex min-h-screen">

    <!-- Settings sub-navigation -->
    <nav class="w-52 shrink-0 bg-slate-900 border-r border-slate-700 p-2">
        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider px-3 mb-2 mt-2">Settings</p>

        <!-- LLM Provider -->
        <button type="button"
                hx-get="/settings/section/llm"
                hx-target="#settings-content"
                hx-swap="innerHTML"
                class="w-full text-left min-h-[44px] flex items-center gap-3 px-3 rounded-md transition-colors text-sm font-semibold
                       {% if active_section == 'llm' %}bg-slate-800 border-l-2 border-green-500 text-slate-100{% else %}text-slate-400 hover:bg-slate-800 hover:text-slate-100{% endif %}">
            <!-- cpu-chip icon -->
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 3v1.5M4.5 8.25H3m18 0h-1.5M4.5 12H3m18 0h-1.5m-15 3.75H3m18 0h-1.5M8.25 19.5V21M12 3v1.5m0 15V21m3.75-18v1.5m0 15V21m-9-1.5h10.5a2.25 2.25 0 0 0 2.25-2.25V6.75a2.25 2.25 0 0 0-2.25-2.25H6.75A2.25 2.25 0 0 0 4.5 6.75v10.5a2.25 2.25 0 0 0 2.25 2.25Zm.75-12h9v9h-9v-9Z" />
            </svg>
            LLM Provider
        </button>

        <!-- Store -->
        <button type="button"
                hx-get="/settings/section/store"
                hx-target="#settings-content"
                hx-swap="innerHTML"
                class="w-full text-left min-h-[44px] flex items-center gap-3 px-3 rounded-md transition-colors text-sm font-semibold
                       {% if active_section == 'store' %}bg-slate-800 border-l-2 border-green-500 text-slate-100{% else %}text-slate-400 hover:bg-slate-800 hover:text-slate-100{% endif %}">
            <!-- map-pin icon -->
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
            </svg>
            Store
        </button>

        <!-- Kroger Account -->
        <button type="button"
                hx-get="/settings/section/account"
                hx-target="#settings-content"
                hx-swap="innerHTML"
                class="w-full text-left min-h-[44px] flex items-center gap-3 px-3 rounded-md transition-colors text-sm font-semibold
                       {% if active_section == 'account' %}bg-slate-800 border-l-2 border-green-500 text-slate-100{% else %}text-slate-400 hover:bg-slate-800 hover:text-slate-100{% endif %}">
            <!-- user-circle icon -->
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
            Kroger Account
        </button>

        <!-- Preferences -->
        <button type="button"
                hx-get="/settings/section/preferences"
                hx-target="#settings-content"
                hx-swap="innerHTML"
                class="w-full text-left min-h-[44px] flex items-center gap-3 px-3 rounded-md transition-colors text-sm font-semibold
                       {% if active_section == 'preferences' %}bg-slate-800 border-l-2 border-green-500 text-slate-100{% else %}text-slate-400 hover:bg-slate-800 hover:text-slate-100{% endif %}">
            <!-- adjustments-horizontal icon -->
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75" />
            </svg>
            Preferences
        </button>

    </nav>

    <!-- Settings content area -->
    <div id="settings-content" class="flex-1 p-8">
        {% include "partials/settings/" ~ active_section ~ ".html" %}
    </div>

</div>
{% endblock %}
